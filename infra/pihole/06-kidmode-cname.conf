# Force YouTube Restricted Mode + SafeSearch by CNAME rewrite.
# Applies device-wide (apps included) to every client using this Pi-hole.
# Nothing on the client can undo it — as long as the client can't switch resolver
# (Tailscale: set Pi-hole as global nameserver + "Override local DNS").
#
# Pi-hole v5: this is a dnsmasq snippet. `kidmode.sh` installs it as
#   /etc/dnsmasq.d/06-kidmode-cname.conf  (and removes it for "off").
# Pi-hole v6: CNAMEs live in /etc/pihole/pihole.toml under [dns] cnameRecords —
#   see kidmode.sh, it edits that instead.
#
# restrictmoderate.youtube.com = Restricted Mode "moderate"; restrict.youtube.com = strict.
# Verify after reload:  dig +short www.youtube.com @<pihole>   → must show the restrict host.

cname=www.youtube.com,restrictmoderate.youtube.com
cname=m.youtube.com,restrictmoderate.youtube.com
cname=youtubei.googleapis.com,restrictmoderate.youtube.com
cname=youtube.googleapis.com,restrictmoderate.youtube.com
cname=www.youtube-nocookie.com,restrictmoderate.youtube.com

# Google SafeSearch — one line per Google TLD you actually use.
cname=www.google.com,forcesafesearch.google.com
cname=www.google.ch,forcesafesearch.google.com
cname=www.google.fr,forcesafesearch.google.com
cname=www.google.de,forcesafesearch.google.com

cname=www.bing.com,strict.bing.com
cname=duckduckgo.com,safe.duckduckgo.com
cname=www.duckduckgo.com,safe.duckduckgo.com
