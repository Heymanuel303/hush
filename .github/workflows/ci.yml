name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hush
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hush
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
      - name: Enable pnpm
        run: npm install -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Design lint
        run: pnpm lint:design
      - run: pnpm typecheck
      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm test
      # The extension (src/, test/) lives outside the pnpm workspace and has no dependencies;
      # it is tested and linted by its own scripts. (`pnpm test` already includes ext:test.)
      - run: pnpm ext:test
      - run: pnpm ext:lint
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
