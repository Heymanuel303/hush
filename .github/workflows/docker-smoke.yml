name: docker-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No platform on the runner: select the local overlay (postgres, a throwaway apps
      # network and the web container on localhost:8080) instead of the default base file.
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^COMPOSE_FILE=.*|COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml|" .env
          sed -i "s|^ADMIN_EMAIL=.*|ADMIN_EMAIL=smoke@hush.local|" .env
          # No idp on the runner: the stack only has to boot, so these point at nothing real.
          sed -i "s|^ISSUER_URL=.*|ISSUER_URL=https://id.smoke.invalid|" .env
          sed -i "s|^CLIENT_SECRET=.*|CLIENT_SECRET=$(openssl rand -hex 12)|" .env
          sed -i "s|^HUB_ENCRYPTION_KEY=.*|HUB_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          grep -q "^SESSION_SECRET=.\+" .env
          grep -q "^ADMIN_EMAIL=.\+" .env
          grep -q "^ISSUER_URL=.\+" .env
          grep -q "^CLIENT_SECRET=.\+" .env
          grep -q "^HUB_ENCRYPTION_KEY=.\+" .env
          grep -q "^COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml$" .env
      # --wait returns non-zero when any healthcheck fails or migrate exits non-zero.
      - name: Build and start the stack
        run: docker compose up --build --wait --wait-timeout 300
        env:
          # Build secret for the GitHub Packages install; repo secret with read:packages.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Web serves the SPA
        run: curl -f http://127.0.0.1:8080/
      - name: API health through nginx
        run: curl -f http://127.0.0.1:8080/api/health
      - name: Setup status reports the admin
        run: curl -f http://127.0.0.1:8080/api/setup/status | grep -q '"adminConfigured":true'
      - name: Admin routes need a session and the password login is gone
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/hub/status)
          test "$code" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/auth/login)
          test "$code" = 404
      - name: Device config without a token is rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/device/config)
          test "$code" = 401
      - name: Worker is running and healthy
        run: docker compose ps worker | grep -q '(healthy)'
      - name: Logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs
      - name: Down
        if: always()
        run: docker compose down -v
